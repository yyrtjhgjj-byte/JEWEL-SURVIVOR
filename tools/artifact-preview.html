<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>秘宝プレビュー</title>
<style>body{margin:0;background:#07070d;color:#ddd;font-family:sans-serif}.g{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:12px}
.c{text-align:center;font-size:12px}canvas{width:100%;aspect-ratio:1;background:radial-gradient(#1d1830,#0b0a12);border:1px solid #e8c56a55;border-radius:10px}</style></head>
<body><div class="g" id="g"></div>
<script type="module">
import { drawArtifact } from '../js/artifact-art.js';
import { ARTIFACTS } from '../js/artifacts.js';
const g = document.getElementById('g');
for (const a of ARTIFACTS) {
  const d = document.createElement('div'); d.className = 'c';
  const c = document.createElement('canvas'); c.width = c.height = 300;
  const x = c.getContext('2d'); x.translate(150, 150); drawArtifact(x, a.id, 260);
  d.append(c, document.createTextNode(a.no + ' ' + a.name)); g.append(d);
}
window.done = true;
</script></body></html>
