<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>宝石の絵のプレビュー</title>
<style>
body{margin:0;background:#07070d;color:#ddd;font-family:sans-serif}
h2{font-size:14px;letter-spacing:.1em;color:#aaa;margin:16px 12px 4px}
.g{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:8px 12px}
.c{text-align:center;font-size:11px;line-height:1.4;background:radial-gradient(#1d1830,#0b0a12);border:1px solid #ffffff22;border-radius:10px;padding:6px 2px}
.c b{display:block;font-size:12px;color:#fff}
.pair{display:flex;justify-content:center;align-items:center;gap:2px}
.pair canvas{width:46%}
.old{opacity:.55}
.small{display:flex;flex-wrap:wrap;gap:6px;padding:8px 12px}
.small canvas{width:28px;height:28px}
</style></head>
<body>
<h2>今（左・薄い） → 新しい案（右）</h2>
<div class="g" id="g"></div>
<h2>ゲーム中の小さいサイズ（HUD・経験値の宝石の大きさ）</h2>
<div class="small" id="s"></div>
<script type="module">
import { drawCutGem, GEM_CUT, CUT_NAMES } from '../js/gem-art.js';
import { drawGem } from '../js/render.js';
import { GEMS } from '../js/data.js';
const ids = Object.keys(GEMS).filter((k) => k !== 'obsidian').sort((a, b) => Object.keys(CUT_NAMES).indexOf(GEM_CUT[a]) - Object.keys(CUT_NAMES).indexOf(GEM_CUT[b]));
const cv = (size, fn) => { const c = document.createElement('canvas'); c.width = c.height = size; const x = c.getContext('2d'); x.translate(size / 2, size / 2); fn(x); return c; };
for (const id of ids) {
  const g = GEMS[id];
  const d = document.createElement('div'); d.className = 'c';
  const p = document.createElement('div'); p.className = 'pair';
  const o = cv(160, (x) => drawGem(x, 52, g)); o.className = 'old';
  const n = cv(160, (x) => drawCutGem(x, 58, g, id));
  p.append(o, n);
  d.append(p);
  d.insertAdjacentHTML('beforeend', `<b>${g.jp}</b>${CUT_NAMES[GEM_CUT[id]]}`);
  document.getElementById('g').append(d);
  document.getElementById('s').append(cv(56, (x) => drawCutGem(x, 22, g, id)));
}
window.done = true;
</script></body></html>
