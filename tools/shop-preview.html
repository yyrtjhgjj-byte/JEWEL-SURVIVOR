<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>工房アイコンのプレビュー</title>
<style>body{margin:0;background:#07070d;color:#ddd;font-family:sans-serif}.g{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:12px}
.c{text-align:center;font-size:12px}canvas{width:100%;aspect-ratio:1;background:radial-gradient(#1d1830,#0b0a12);border:1px solid #ffffff22;border-radius:10px}</style></head>
<body><div class="g" id="g"></div>
<script type="module">
import { drawShopIcon } from '../js/shop-art.js';
import { SHOP } from '../js/data.js';
const g = document.getElementById('g');
for (const it of SHOP) {
  const d = document.createElement('div'); d.className = 'c';
  const c = document.createElement('canvas'); c.width = c.height = 240;
  const x = c.getContext('2d'); x.translate(120, 120); drawShopIcon(x, it.id, 210);
  d.append(c, document.createTextNode(it.name)); g.append(d);
}
window.done = true;
</script></body></html>
